name: Astro博客部署
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        id: pnpm_store
        shell: bash
        run: echo "PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.PATH }}
          key: ${{ runner.os }}-pnpm-lock-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-lock-

      - name: Install dependencies & Build
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Package dist to dist.tar.gz
        run: tar -zcf dist.tar.gz ./dist

      - name: Upload tar.gz native rsync (progress convert to newline)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\nStrictHostKeyChecking no\nUserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 644 ~/.ssh/config

          rsync -vz --info=progress2 --stats --timeout=240 --compress-level=1 \
            -e "ssh -p ${{ secrets.SERVER_PORT }}" ./dist.tar.gz root@${{ secrets.SERVER_HOST }}:/tmp/ \
            | stdbuf -oL tr '\r' '\n'

      - name: Server‑side decompress & atomic replace
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\nStrictHostKeyChecking no\nUserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 644 ~/.ssh/config

          ssh -p ${{ secrets.SERVER_PORT }} root@${{ secrets.SERVER_HOST }} "
            rm -rf /www/wwwroot/Blog_Tmp
            mkdir -p /www/wwwroot/Blog_Tmp
            tar -zxf /tmp/dist.tar.gz -C /www/wwwroot/Blog_Tmp --strip-components=1
            rm -f /tmp/dist.tar.gz
            if [ -n \"\$(ls -A /www/wwwroot/Blog_Tmp 2>/dev/null)\" ]; then
              rm -rf /www/wwwroot/Blog/*
              mv /www/wwwroot/Blog_Tmp/* /www/wwwroot/Blog/
              echo \"✅部署完成，新版已上线\"
            else
              echo \"❌Blog_Tmp为空，终止替换，保留旧站点\"
              exit 1
            fi
          "
