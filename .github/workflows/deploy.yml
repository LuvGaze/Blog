name: 博客自动部署
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4

      - name: 配置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置pnpm包管理器
        uses: pnpm/action-setup@v4

      - name: 获取pnpm缓存路径
        id: pnpm_store
        shell: bash
        run: echo "PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 启用pnpm依赖缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.PATH }}
          key: ${{ runner.os }}-pnpm-lock-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-lock-

      # 从 GitHub Secrets 写入 .env 构建配置（构建期读取：地图 Key、账单密码）
      # 前提：先在仓库 Settings → Secrets and variables → Actions 中新建同名 Secrets
      - name: 写入 .env 构建配置
        shell: bash
        run: |
          set -e
          printf '%s\n' \
            'PUBLIC_AMAP_KEY_PLACES=${{ secrets.PUBLIC_AMAP_KEY_PLACES }}' \
            'PUBLIC_AMAP_SECURITY_JS_CODE=${{ secrets.PUBLIC_AMAP_SECURITY_JS_CODE }}' \
            'PUBLIC_AMAP_GEO_KEY=${{ secrets.PUBLIC_AMAP_GEO_KEY }}' \
            'PUBLIC_AMAP_GEO_SECRET=${{ secrets.PUBLIC_AMAP_GEO_SECRET }}' \
            'GATE_PASSWORD=${{ secrets.GATE_PASSWORD }}' \
            > .env

      - name: 安装依赖并构建项目
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: 增量同步dist目录到服务器临时目录
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\nStrictHostKeyChecking no\nUserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 644 ~/.ssh/config

          # 增量同步：本地dist/ 同步到服务器 Blog_Tmp/
          # --delete：服务器删除本地dist已经不存在的旧文件
          # --info=progress2 输出进度，转换\r为\n，显示百分比
          rsync -vzr --info=progress2 --stats --timeout=600 --delete \
            --no-times --no-perms --no-owner --no-group \
            -e "ssh -p ${{ secrets.SERVER_PORT }}" ./dist/ root@${{ secrets.SERVER_HOST }}:/www/wwwroot/Blog_Tmp/ \
            | stdbuf -oL tr '\r' '\n'

      - name: 原子替换线上站点目录
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo -e "Host *\nStrictHostKeyChecking no\nUserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 644 ~/.ssh/config

          ssh -p ${{ secrets.SERVER_PORT }} root@${{ secrets.SERVER_HOST }} "
            if [ -n \"\$(ls -A /www/wwwroot/Blog_Tmp 2>/dev/null)\" ]; then
              rm -rf /www/wwwroot/Blog/*
              # cp‑a复制，Blog_Tmp维持完整基准，供下一次增量rsync对比
              cp -a /www/wwwroot/Blog_Tmp/* /www/wwwroot/Blog/
              echo \"✅部署完成，新版已上线\"
            else
              echo \"❌Blog_Tmp为空，终止替换，保留旧站点\"
              exit 1
            fi
          "
